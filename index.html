<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Price Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Gas Price Finder</h1>
        <p>Find and compare gasoline prices.</p>
    </header>

    <main>
        <input type="text" id="search"
        placeholder="Search gas prices">

        <section id="results">
            <h2>Gas Price Information</h2>
            <p>Gas price records will appear here.</p>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
